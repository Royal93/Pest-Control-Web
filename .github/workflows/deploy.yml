name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Debug - check secret length
        run: |
          TOKEN="${{ secrets.DEPLOY_TOKEN }}"
          echo "Token length as seen by GitHub Actions: ${#TOKEN}"

      # ── Package the full app (outside the web root) ──
      - name: Package app code
        run: |
          zip -rq app-deploy.zip . \
            -x '.git/*' -x '.git*' -x '.github/*' -x '.github/**' \
            -x 'node_modules/*' -x 'node_modules/**' \
            -x 'tests/*' -x 'tests/**' \
            -x 'public/build/*' -x 'public/build/**' \
            -x 'storage/app/public/*' -x 'storage/app/public/**' \
            -x '.env' \
            -x 'sppest-deploy/*' -x 'sppest-deploy/**' \
            -x '*.zip'

      # ── Package only the public assets (into the actual web root) ──
      - name: Package public assets
        run: |
          cd public
          zip -rq ../public-deploy.zip . \
            -x 'storage/*' -x 'storage/**' \
            -x '.htaccess' \
            -x 'wp-content/*' -x 'wp-content/**' \
            -x 'dir/*' -x 'dir/**' \
            -x 'ym/*' -x 'ym/**'
          cd ..

      - name: Deploy app code via webhook
        run: |
          response=$(curl -sS --max-time 120 -w "\nHTTP_STATUS:%{http_code}" -X POST https://nomorepest.co.za/deploy-receiver.php \
            -F "token=${{ secrets.DEPLOY_TOKEN }}" \
            -F "target=app" \
            -F "payload=@app-deploy.zip")
          echo "$response"
          status=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "Deploy failed with status $status"
            exit 1
          fi

      - name: Deploy public assets via webhook
        run: |
          response=$(curl -sS --max-time 120 -w "\nHTTP_STATUS:%{http_code}" -X POST https://nomorepest.co.za/deploy-receiver.php \
            -F "token=${{ secrets.DEPLOY_TOKEN }}" \
            -F "target=public" \
            -F "payload=@public-deploy.zip")
          echo "$response"
          status=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "Deploy failed with status $status"
            exit 1
          fi
